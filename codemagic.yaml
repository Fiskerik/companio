workflows:
  verify:
    name: Companio · Verify
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 24
      vars:
        EXPO_PUBLIC_DEMO_ENABLED: 'true'
    triggering:
      events: [pull_request]
      branch_patterns:
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Type and database checks
        script: npm run check
      - name: Export web
        script: npm run build:web
    artifacts:
      - dist/**
  ios-testflight:
    name: Companio · iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: codemagic-app-store-connect
    environment:
      node: 24
      xcode: latest
      cocoapods: default
      groups:
        - env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fiskerik.companio
      vars:
        BUNDLE_ID: com.fiskerik.companio
        # Temporary local preview; set false when account testing is ready.
        EXPO_PUBLIC_DEMO_ENABLED: 'true'
        EXPO_PUBLIC_TESTFLIGHT_DEMO: 'true'
        XCODE_SCHEME: Companio
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: ios-*
          include: true
    scripts:
      - name: Validate TestFlight configuration
        script: node scripts/check-env.mjs --testflight
      - name: Install and verify
        script: |
          npm ci
          npm run check
      - name: Generate native iOS project
        script: |
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Increment iOS build number
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios"
          # Apple rejects an IPA when its CFBundleVersion has already been
          # uploaded. Use the latest App Store value as the lower bound and
          # Codemagic's project counter as a deterministic fallback.
          LATEST_BUILD_NUMBER="$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -n 1 | tr -cd '0-9' || true)"
          LATEST_BUILD_NUMBER="${LATEST_BUILD_NUMBER:-0}"
          PROJECT_BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-0}"
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          if [ "$PROJECT_BUILD_NUMBER" -gt "$NEXT_BUILD_NUMBER" ]; then
            NEXT_BUILD_NUMBER="$PROJECT_BUILD_NUMBER"
          fi
          echo "Using iOS build number: $NEXT_BUILD_NUMBER (latest on App Store: $LATEST_BUILD_NUMBER)"
          agvtool new-version -all "$NEXT_BUILD_NUMBER"
          APPLIED_BUILD_NUMBER="$(agvtool what-version -terse | tr -d '[:space:]')"
          if [ "$APPLIED_BUILD_NUMBER" != "$NEXT_BUILD_NUMBER" ]; then
            echo "Build number verification failed: expected $NEXT_BUILD_NUMBER, got $APPLIED_BUILD_NUMBER"
            exit 1
          fi
      - name: Apply signing profiles
        # Mark the IPA as internal-testing-only so App Store Connect does not
        # require Apple's external beta-review metadata for this pilot.
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Archive signed app
        script: xcode-project build-ipa --workspace "ios/Companio.xcworkspace" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Beta
        submit_to_app_store: false
